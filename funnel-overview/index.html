<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="origin">
  <title>Funnel Overview</title>
  <script defer src="../assets/portal-analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/dashboard.css">
</head>
<body class="classic-dashboard funnel-dashboard">
  <header class="gs-header">
    <button id="portal-home" class="wordmark portal-home" type="button" aria-label="Reset Funnel Overview">Gateway Seminary<span>Admissions · Enrollment Tools</span></button>
    <div class="header-divider"></div>
    <a class="header-title header-home" href="../" target="_top" aria-label="Return to Enrollment Tools">Home</a>
    <div class="header-spacer"></div>
    <button id="action-toggle" class="icon-button" type="button" title="Action items" aria-label="Open action items">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-1.7 0-3 1.3-3 3v.5C6.7 6.3 5 8.5 5 11v4l-1.5 2.5C3.2 18 3.5 19 4.4 19h15.2c.9 0 1.2-1 .8-1.5L19 15v-4c0-2.5-1.7-4.7-4-5.5V5c0-1.7-1.3-3-3-3Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"/><path d="M9.5 21a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/></svg>
      <span id="notification-count" class="notification-count">0</span>
    </button>
  </header>

  <div id="drawer-overlay" class="drawer-overlay" hidden></div>
  <aside id="action-drawer" class="drawer" aria-label="Action items" hidden>
    <div class="drawer-head"><h2>Action Items</h2><button id="drawer-close" class="close-button" type="button" aria-label="Close">×</button></div>
    <div class="panel">
      <table class="data-table">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr></thead>
        <tbody id="action-table"></tbody>
      </table>
    </div>
    <div id="action-empty" class="empty-state" hidden>No F-1 student action items right now.</div>
  </aside>

  <div id="loading" class="loading">Waiting for Funnel data from Slate…</div>
  <main id="app" class="container" hidden>
    <div class="controls-row">
      <div class="control-group"><label class="ctrl-label" for="period">Period</label><select id="period" class="control-select"></select></div>
      <div class="control-group">
        <span class="ctrl-label">Conversion</span>
        <div class="conversion-mode-control">
          <div class="toggle-group" role="group" aria-label="Conversion mode">
            <button id="cumulative" class="toggle-btn" type="button">From Stage 1</button>
            <button id="sequential" class="toggle-btn" type="button">Step-to-Step</button>
          </div>
          <div id="choke-info-wrap" class="choke-info-wrap">
            <button id="choke-info-toggle" class="choke-info-button" type="button" aria-label="Explain the largest funnel choke point" aria-expanded="false" aria-controls="choke-info-popover">i</button>
            <div id="choke-info-popover" class="choke-info-popover" role="dialog" aria-labelledby="choke-info-title" hidden>
              <button id="choke-info-close" class="choke-info-close" type="button" aria-label="Close choke-point explanation">×</button>
              <div class="choke-info-eyebrow">Biggest Choke Point</div>
              <div id="choke-info-title" class="choke-info-title">Waiting for funnel data</div>
              <p id="choke-info-explanation"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="stat-bar">
      <div class="stat-cell"><div id="sum-inquiries" class="stat-val">0</div><div class="stat-lbl">Inquiries</div></div>
      <div class="stat-cell"><div id="sum-applications" class="stat-val">0</div><div class="stat-lbl">Applications</div></div>
      <div class="stat-cell"><div id="sum-awaiting" class="stat-val">0</div><div class="stat-lbl">Awaiting Approval</div></div>
      <div class="stat-cell"><div id="sum-admitted" class="stat-val">0</div><div class="stat-lbl">Admitted</div></div>
    </div>

    <div id="funnel" class="funnel"></div>

    <div class="section-divider"><div class="section-eyebrow">Awaiting Approval</div><div class="section-heading">Applicants Pending Review</div></div>
    <div class="panel">
      <table class="data-table">
        <thead><tr><th>Name</th><th>Program</th><th>Email</th><th><button id="sort-status" class="toggle-btn" type="button" style="color:#fff;padding:0">Status ↕</button></th></tr></thead>
        <tbody id="awaiting-table"></tbody>
      </table>
      <div class="pagination">
        <span id="page-info"></span>
        <div id="page-buttons" class="pagination-buttons"></div>
        <div><label class="ctrl-label" for="per-page">Rows</label> <select id="per-page" class="control-select" style="min-width:75px;padding:6px 8px"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></div>
      </div>
    </div>
  </main>

  <script src="../assets/dashboard-common.js"></script>
  <script>
  (function () {
    'use strict';
    const funnelPeriods = {
      total: { label:'Total (All Time)', start:null, end:null, term:null, year:null },
      FA26: { label:'FA26 — Fall 2026', start:'2026-01-01', end:'2026-08-15', term:'Fall', year:'2026-2027' },
      SP27: { label:'SP27 — Spring 2027', start:'2026-08-16', end:'2027-01-15', term:'Spring', year:'2026-2027' },
      FA27: { label:'FA27 — Fall 2027', start:'2027-01-16', end:'2027-08-15', term:'Fall', year:'2027-2028' }
    };
    const ui = window.DashboardUI;
    let data = { counts:{}, awaiting:[], actions:[], filters:{} };
    let conversionMode = sessionStorage.getItem('funnel-conversion-mode') || 'cumulative';
    let currentPage = 1;
    let perPage = 25;
    let statusDirection = 0;
    const bridge = window.DashboardBridge.create('funnel-overview', render);

    function render(payload) {
      data = payload || data;
      data.counts = data.counts || {}; data.filters = data.filters || {};
      data.awaiting = Array.isArray(data.awaiting) ? data.awaiting : [];
      data.actions = Array.isArray(data.actions) ? data.actions : [];
      if (!sessionStorage.getItem('funnel-conversion-mode') && ['cumulative','sequential'].includes(data.filters.convMode)) conversionMode = data.filters.convMode;
      populatePeriod(); updateModeButtons();
      ui.setText('sum-inquiries', ui.number(data.counts.inquiries).toLocaleString());
      ui.setText('sum-applications', ui.number(data.counts.applications).toLocaleString());
      ui.setText('sum-awaiting', ui.number(data.counts.awaiting).toLocaleString());
      ui.setText('sum-admitted', ui.number(data.counts.admitted).toLocaleString());
      renderFunnel(); renderActions(); renderAwaiting(); ui.showApp();
    }

    function populatePeriod() {
      const select = document.getElementById('period'); select.replaceChildren();
      Object.keys(funnelPeriods).forEach(function (key) { const option = document.createElement('option'); option.value = key; option.textContent = funnelPeriods[key].label; select.appendChild(option); });
      select.value = Object.keys(funnelPeriods).find(function (key) { return funnelPeriods[key].start === (data.filters.startDate || null); }) || 'total';
    }

    function percent(value, base) {
      if (base <= 0) return 0;
      return Math.min(100, Math.max(0, Math.round(value * 1000 / base) / 10));
    }

    function reachedCounts(stages) {
      let downstream = 0;
      return stages.slice().reverse().map(function (stage) {
        downstream += Math.max(0, stage.count);
        return downstream;
      }).reverse();
    }

    function conversionValues(stages, index, mode) {
      const reached = reachedCounts(stages);
      const value = reached[index];
      const base = mode === 'cumulative'
        ? reached[0]
        : reached[index - 1];
      return { value:value, base:base };
    }

    function largestChokePoint(stages) {
      const reached = reachedCounts(stages);
      return stages.slice(1).map(function (stage, offset) {
        const index = offset + 1;
        const base = reached[index - 1];
        const stalled = Math.max(0, stages[index - 1].count);
        return {
          from:stages[index - 1].label,
          to:stage.label,
          base:base,
          stalled:stalled,
          advanced:reached[index],
          stalledRate:percent(stalled, base),
          conversionRate:percent(reached[index], base)
        };
      }).filter(function (point) { return point.base > 0; }).sort(function (a, b) {
        return b.stalledRate - a.stalledRate || b.stalled - a.stalled;
      })[0] || null;
    }

    function renderChokePoint(stages) {
      const point = largestChokePoint(stages);
      const title = document.getElementById('choke-info-title');
      const explanation = document.getElementById('choke-info-explanation');
      if (!point) {
        title.textContent = 'No choke point available';
        explanation.textContent = 'There is not enough funnel data to identify where inquiries are currently waiting.';
        return;
      }
      title.textContent = point.from + ' → ' + point.to;
      explanation.textContent = point.stalled.toLocaleString() + ' of ' + point.base.toLocaleString() + ' people who reached ' + point.from + ' (' + point.stalledRate + '%) currently remain in that stage. ' + point.advanced.toLocaleString() + ' (' + point.conversionRate + '%) have advanced to ' + point.to + ' or beyond.';
    }

    function renderFunnel() {
      const stages = [
        { label:'Inquiries', count:ui.number(data.counts.inquiries), color:'#1a2b4a' },
        { label:'Applied', count:ui.number(data.counts.applications), color:'#1e3b6e' },
        { label:'Awaiting Approval', count:ui.number(data.counts.awaiting), color:'#c8952a' },
        { label:'Admitted', count:ui.number(data.counts.admitted), color:'#2a6b3c' }
      ];
      renderChokePoint(stages);
      const root = document.getElementById('funnel'); root.replaceChildren();
      const maxWidth = 680;
      const minWidth = 220;
      const height = 80;
      const step = (maxWidth - minWidth) / (stages.length - 1);
      const svgNamespace = 'http://www.w3.org/2000/svg';
      stages.forEach(function (stage, index) {
        const topWidth = maxWidth - index * step;
        const bottomWidth = index === stages.length - 1 ? minWidth : Math.max(minWidth, topWidth - step);
        const inset = (topWidth - bottomWidth) / 2;
        const element = document.createElement('div');
        element.className = 'funnel-stage';
        element.style.width = topWidth + 'px';

        const svg = document.createElementNS(svgNamespace, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + topWidth + ' ' + height);
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.setAttribute('aria-hidden', 'true');
        const definitions = document.createElementNS(svgNamespace, 'defs');
        const gradient = document.createElementNS(svgNamespace, 'linearGradient');
        gradient.id = 'funnel-gradient-' + index;
        gradient.setAttribute('x1', '0'); gradient.setAttribute('y1', '0'); gradient.setAttribute('x2', '0'); gradient.setAttribute('y2', '1');
        const topStop = document.createElementNS(svgNamespace, 'stop'); topStop.setAttribute('offset', '0%'); topStop.setAttribute('stop-color', stage.color);
        const bottomStop = document.createElementNS(svgNamespace, 'stop'); bottomStop.setAttribute('offset', '100%'); bottomStop.setAttribute('stop-color', stage.color); bottomStop.setAttribute('stop-opacity', '.82');
        gradient.append(topStop, bottomStop); definitions.appendChild(gradient); svg.appendChild(definitions);
        const polygon = document.createElementNS(svgNamespace, 'polygon');
        polygon.setAttribute('points', '0,0 ' + topWidth + ',0 ' + (topWidth - inset) + ',' + height + ' ' + inset + ',' + height);
        polygon.setAttribute('fill', 'url(#' + gradient.id + ')'); svg.appendChild(polygon);

        const label = document.createElement('div'); label.className = 'funnel-label';
        const name = document.createElement('div'); name.className = 'stage-name'; name.textContent = stage.label;
        const count = document.createElement('div'); count.className = 'stage-count'; count.textContent = stage.count.toLocaleString();
        label.append(name, count);
        if (index) {
          // The live counts are mutually exclusive current-state buckets.
          // Cumulative mode compares reached populations with everyone who ever
          // reached Stage 1; sequential mode compares adjacent reached populations.
          const conversion = conversionValues(stages, index, conversionMode);
          const rate = document.createElement('div'); rate.className = 'stage-rate';
          rate.textContent = (conversionMode === 'cumulative' ? 'From Inquiries: ' : 'From Prev: ') + percent(conversion.value, conversion.base) + '%';
          rate.title = conversion.value.toLocaleString() + ' of ' + conversion.base.toLocaleString() + ' people in the comparison population';
          label.appendChild(rate);
        }
        element.append(svg, label); root.appendChild(element);
      });
    }

    function dismissedIds() {
      try { const value = JSON.parse(localStorage.getItem('funnel-dismissed-actions') || '[]'); return Array.isArray(value) ? value : []; }
      catch (_) { return []; }
    }
    function actionId(record) { return record.email || record.url || record.name; }
    function renderActions() {
      const dismissed = dismissedIds();
      const actions = data.actions.filter(function (record) { return !dismissed.includes(actionId(record)); });
      const body = document.getElementById('action-table'); body.replaceChildren();
      actions.forEach(function (record) {
        const row = body.insertRow(); row.className = 'clickable'; row.tabIndex = 0;
        row.insertCell().textContent = ui.text(record.name); row.insertCell().textContent = ui.text(record.email); row.insertCell().textContent = ui.text(record.phone);
        const action = row.insertCell(); const dismiss = document.createElement('button'); dismiss.className = 'dismiss-button'; dismiss.type = 'button'; dismiss.textContent = '×'; dismiss.title = 'Dismiss';
        dismiss.addEventListener('click', function (event) { event.stopPropagation(); const ids = dismissedIds(); const id = actionId(record); if (!ids.includes(id)) ids.push(id); localStorage.setItem('funnel-dismissed-actions', JSON.stringify(ids)); renderActions(); });
        action.appendChild(dismiss); row.addEventListener('click', function () { bridge.openRecord(record.url); });
        row.addEventListener('keydown', function (event) { if (event.key === 'Enter') bridge.openRecord(record.url); });
      });
      document.getElementById('notification-count').textContent = actions.length;
      document.getElementById('notification-count').hidden = !actions.length;
      document.getElementById('action-empty').hidden = !!actions.length;
    }

    function sortedAwaiting() {
      const records = data.awaiting.slice();
      if (statusDirection) records.sort(function (a, b) { return statusDirection * ui.text(a.status, '').localeCompare(ui.text(b.status, '')); });
      return records;
    }
    function statusBadge(status) {
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = ui.text(status);
      if (status === 'Awaiting Payment') badge.classList.add('badge-bad');
      else if (status === 'Awaiting Decision' || status === 'Awaiting Confirmation') badge.classList.add('badge-gold');
      return badge;
    }
    function renderAwaiting() {
      const records = sortedAwaiting();
      const pages = Math.max(1, Math.ceil(records.length / perPage)); currentPage = Math.min(currentPage, pages);
      const visible = records.slice((currentPage - 1) * perPage, currentPage * perPage);
      const body = document.getElementById('awaiting-table'); body.replaceChildren();
      if (!visible.length) { const row = body.insertRow(); const cell = row.insertCell(); cell.colSpan = 4; cell.appendChild(ui.emptyState('No applicants currently awaiting approval.')); }
      visible.forEach(function (record) {
        const row = body.insertRow(); row.className = 'clickable'; row.tabIndex = 0;
        row.insertCell().textContent = ui.text(record.name); row.insertCell().textContent = ui.text(record.program); row.insertCell().textContent = ui.text(record.email);
        row.insertCell().appendChild(statusBadge(record.status));
        row.addEventListener('click', function () { bridge.openRecord(record.url); });
        row.addEventListener('keydown', function (event) { if (event.key === 'Enter') bridge.openRecord(record.url); });
      });
      const start = records.length ? (currentPage - 1) * perPage + 1 : 0; const end = Math.min(currentPage * perPage, records.length);
      document.getElementById('page-info').textContent = start + '–' + end + ' of ' + records.length;
      renderPagination(pages);
    }
    function renderPagination(pages) {
      const root = document.getElementById('page-buttons'); root.replaceChildren();
      function button(label, page, disabled, active) { const element = document.createElement('button'); element.className = 'page-button' + (active ? ' active' : ''); element.type = 'button'; element.textContent = label; element.disabled = disabled; element.addEventListener('click', function () { currentPage = page; renderAwaiting(); }); return element; }
      root.appendChild(button('‹', Math.max(1, currentPage - 1), currentPage === 1, false));
      for (let page = 1; page <= pages; page += 1) { if (pages <= 7 || page === 1 || page === pages || Math.abs(page - currentPage) <= 1) root.appendChild(button(page, page, false, page === currentPage)); }
      root.appendChild(button('›', Math.min(pages, currentPage + 1), currentPage === pages, false));
    }

    function updateModeButtons() {
      document.getElementById('cumulative').classList.toggle('active', conversionMode === 'cumulative');
      document.getElementById('sequential').classList.toggle('active', conversionMode === 'sequential');
      document.getElementById('choke-info-wrap').hidden = conversionMode !== 'cumulative';
      if (conversionMode !== 'cumulative') setChokeInfo(false);
    }
    function setChokeInfo(open) {
      document.getElementById('choke-info-popover').hidden = !open;
      document.getElementById('choke-info-toggle').setAttribute('aria-expanded', String(open));
    }
    function setMode(mode) { conversionMode = mode; sessionStorage.setItem('funnel-conversion-mode', mode); updateModeButtons(); renderFunnel(); }
    function setDrawer(open) { document.getElementById('action-drawer').hidden = !open; document.getElementById('drawer-overlay').hidden = !open; bridge.resize(); }

    document.getElementById('period').addEventListener('change', function (event) {
      const period = funnelPeriods[event.target.value] || funnelPeriods.total;
      if (!period.start) bridge.navigate({ conv_mode:conversionMode }, ['start_date','end_date','term_app','year_app']);
      else bridge.navigate({ start_date:period.start, end_date:period.end, term_app:period.term, year_app:period.year, conv_mode:conversionMode }, []);
    });
    document.getElementById('cumulative').addEventListener('click', function () { setMode('cumulative'); });
    document.getElementById('sequential').addEventListener('click', function () { setMode('sequential'); });
    document.getElementById('portal-home').addEventListener('click', function () {
      sessionStorage.removeItem('funnel-conversion-mode');
      bridge.navigate({}, ['start_date', 'end_date', 'term_app', 'year_app', 'conv_mode']);
    });
    document.getElementById('sort-status').addEventListener('click', function () { statusDirection = statusDirection === 1 ? -1 : 1; currentPage = 1; renderAwaiting(); });
    document.getElementById('per-page').addEventListener('change', function (event) { perPage = Number(event.target.value) || 25; currentPage = 1; renderAwaiting(); });
    document.getElementById('choke-info-toggle').addEventListener('click', function () { setChokeInfo(document.getElementById('choke-info-popover').hidden); });
    document.getElementById('choke-info-close').addEventListener('click', function () { setChokeInfo(false); });
    document.getElementById('action-toggle').addEventListener('click', function () { setDrawer(true); });
    document.getElementById('drawer-close').addEventListener('click', function () { setDrawer(false); });
    document.getElementById('drawer-overlay').addEventListener('click', function () { setDrawer(false); });
    window.addEventListener('keydown', function (event) { if (event.key === 'Escape') { setDrawer(false); setChokeInfo(false); } });
  }());
  </script>
</body>
</html>
