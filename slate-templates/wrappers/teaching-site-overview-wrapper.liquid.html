<!--
  Teaching Sites Slate wrapper.
  Configure teaching_sites_persons to use the optional status, term, and year URL
  parameters and to include records with a blank teaching-site title. The hosted
  page uses the full result count as its percentage denominator.
-->
<div id="teachingSiteOverviewData" style="display:none">
  <div class="records">{% for record in teaching_sites_persons %}<div class="record"><span class="title">{{ record.title | escape }}</span></div>{% endfor %}</div>
</div>
<iframe id="teachingSiteOverviewFrame" src="https://enrollmentgateway-lab.github.io/enrollmentgatewaytools/teaching-site-overview/" title="Teaching Sites Overview" style="width:100%;height:100vh;min-height:600px;border:0;display:block"></iframe>
<script>
(function () {
  'use strict';
  const dashboard = 'teaching-site-overview';
  const frameOrigin = 'https://enrollmentgateway-lab.github.io';
  const frame = document.getElementById('teachingSiteOverviewFrame');
  const root = document.getElementById('teachingSiteOverviewData');
  const read = (node, key) => { const el = node && node.querySelector('.' + key); return el ? el.textContent.trim() : ''; };
  const pageUrl = new URL(window.location.href);
  const payload = {
    filters: { status: pageUrl.searchParams.get('status') || 'applicant', term: pageUrl.searchParams.get('term') || '', year: pageUrl.searchParams.get('year') || '' },
    records: Array.from(root.querySelectorAll('.record')).map(node => ({ title: read(node, 'title') }))
  };
  const allowedParams = new Set(['status', 'term', 'year']);
  function sendData() { if (frame.contentWindow) frame.contentWindow.postMessage({ type:'enrollment-dashboard-data', dashboard, payload }, frameOrigin); }
  function navigate(message) {
    const url = new URL(window.location.href);
    Object.keys(message.set || {}).forEach(key => { const value = String(message.set[key] || '').trim(); if (allowedParams.has(key) && value.length <= 100) url.searchParams.set(key, value); });
    (message.remove || []).forEach(key => { if (allowedParams.has(key)) url.searchParams.delete(key); });
    window.location.assign(url.toString());
  }
  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data || event.data.dashboard !== dashboard) return;
    if (event.data.type === 'enrollment-dashboard-ready') sendData();
    if (event.data.type === 'enrollment-dashboard-resize') frame.style.height = Math.max(600, Math.min(Number(event.data.height) || 600, 10000)) + 'px';
    if (event.data.type === 'enrollment-dashboard-navigate') navigate(event.data);
  });
  frame.addEventListener('load', sendData);
}());
</script>
