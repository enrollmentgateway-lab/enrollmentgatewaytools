<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate iframe bridge test</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #1a2b4a; background: #f7f4ef; }
    body { margin: 0; padding: 1.5rem; }
    main { max-width: 48rem; padding: 1.25rem; background: #fff; border: 1px solid #ddd8d0; border-radius: .4rem; }
    h1 { margin-top: 0; font-size: 1.25rem; }
    #status { font-weight: 700; color: #b84040; }
    #payload { margin: 1rem 0 0; overflow: auto; border: 1px solid #ddd8d0; border-radius: .25rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .65rem .75rem; text-align: left; border-bottom: 1px solid #ddd8d0; }
    th { background: #1a2b4a; color: #fff; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Slate iframe bridge test</h1>
    <p id="status">Waiting for a message from the Slate portal…</p>
    <div id="payload" hidden></div>
  </main>
  <script>
    const status = document.getElementById('status');
    const payload = document.getElementById('payload');

    function reportHeight() {
      const height = Math.ceil(document.documentElement.scrollHeight);
      console.info('[iframe bridge] reporting height', height);
      window.parent.postMessage({ type: 'slate-iframe-resize', height }, '*');
    }

    console.info('[iframe bridge] receiver loaded', {
      origin: window.location.origin,
      embedded: window.self !== window.top
    });

    window.addEventListener('message', (event) => {
      console.info('[iframe bridge] message received', {
        origin: event.origin,
        type: event.data && event.data.type
      });
      // The production pages will replace this with the exact Slate origin.
      if (!event.origin.endsWith('.gs.edu')) {
        console.warn('[iframe bridge] rejected message: unexpected origin', event.origin);
        return;
      }
      if (!event.data || event.data.type !== 'slate-iframe-test') {
        console.warn('[iframe bridge] rejected message: unexpected payload');
        return;
      }

      status.textContent = 'Message received from Slate.';
      status.style.color = '#2a6b3c';
      const people = Array.isArray(event.data.payload.people) ? event.data.payload.people : [];
      payload.hidden = false;
      payload.innerHTML = '';

      if (!people.length) {
        payload.textContent = 'Message received, but no people were supplied.';
        return;
      }

      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>First</th><th>Last</th><th>Email</th></tr></thead>';
      const body = document.createElement('tbody');
      people.forEach((person) => {
        const row = document.createElement('tr');
        ['first', 'last', 'email'].forEach((field) => {
          const cell = document.createElement('td');
          cell.textContent = person[field] || '';
          row.appendChild(cell);
        });
        body.appendChild(row);
      });
      table.appendChild(body);
      payload.appendChild(table);
      requestAnimationFrame(reportHeight);
    });

    window.addEventListener('load', () => {
      reportHeight();
      // Slate can finish registering its listener after a very fast iframe load.
      window.setTimeout(reportHeight, 100);
      window.setTimeout(reportHeight, 500);
    });
    new ResizeObserver(reportHeight).observe(document.documentElement);
  </script>
</body>
</html>
