<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate iframe bridge test</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #1a2b4a; background: #f7f4ef; }
    body { margin: 0; padding: 1.5rem; }
    main { max-width: 48rem; padding: 1.25rem; background: #fff; border: 1px solid #ddd8d0; border-radius: .4rem; }
    h1 { margin-top: 0; font-size: 1.25rem; }
    #status { font-weight: 700; color: #b84040; }
    #payload { margin: 1rem 0 0; padding: .75rem; overflow: auto; background: #f7f4ef; border-radius: .25rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Slate iframe bridge test</h1>
    <p id="status">Waiting for a message from the Slate portal…</p>
    <pre id="payload" hidden></pre>
  </main>
  <script>
    const status = document.getElementById('status');
    const payload = document.getElementById('payload');

    window.addEventListener('message', (event) => {
      // The production pages will replace this with the exact Slate origin.
      if (!event.origin.endsWith('.gs.edu')) return;
      if (!event.data || event.data.type !== 'slate-iframe-test') return;

      status.textContent = 'Message received from Slate.';
      status.style.color = '#2a6b3c';
      payload.hidden = false;
      payload.textContent = JSON.stringify(event.data.payload, null, 2);
    });
  </script>
</body>
</html>
