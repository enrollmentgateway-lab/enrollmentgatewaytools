<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <title>Slate Idea Box</title>
  <script defer src="../assets/portal-analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Semibold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    /* GS 2026 brand refresh - see ../BRANDGUIDE.md. Colors are the guide's 7
       swatches only (black, white, teal, rust, gold, gray-blue, dark gray)
       plus the neutral canvas/border/muted values already established by
       analytics/index.html - no invented accent tints. Type is the three-tier
       Tiempos Fine / Montserrat / Open Sans system, and every corner routes
       through --radius so the page carries the flat 4px treatment. */
    :root {
      --navy: #0c0f14; --navy-mid: #2c343a; --teal: #234048; --gold: #d3a422;
      --accent3: #708aa2; --red: #c44329;
      --ink: #2c343a; --muted: #5c6670; --border: #dcd8d0; --canvas: #f4f2ee; --white: #fff;
      --radius: 4px; --shadow: 0 4px 16px rgba(12,15,20,.08);
      --font-heading: 'Tiempos Fine', Georgia, serif;
      --font-subheading: Montserrat, 'Segoe UI', sans-serif;
      --font-body: 'Open Sans', system-ui, sans-serif;
      font-family: var(--font-body);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); }
    button, select, input, textarea { font: inherit; }

    header.top {
      display: flex; align-items: center; gap: 16px;
      padding: 15px max(20px, calc((100% - 900px) / 2));
      color: #fff; background: linear-gradient(120deg, var(--navy), var(--navy-mid));
      border-bottom: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 4px 18px rgba(12,15,20,.14);
    }
    header.top .wordmark { display: flex; align-items: center; color: inherit; text-decoration: none; }
    header.top .wordmark-logo { height: 26px; width: auto; }
    header.top .divider { width: 1px; height: 36px; background: rgba(255,255,255,.28); }
    /* Eyebrow flanked by short gold rules - the guide's "- ACADEMICS -" device. */
    header.top .page-title { display: inline-flex; align-items: center; gap: 10px; color: var(--gold); font: 700 .78rem var(--font-subheading); letter-spacing: .1em; text-transform: uppercase; }
    header.top .page-title::before, header.top .page-title::after { content: ''; width: 16px; height: 1px; background: var(--gold); }
    header.top .spacer { flex: 1; }
    #admin-toggle {
      height: 34px; padding: 0 14px; border: 1px solid rgba(255,255,255,.35); border-radius: var(--radius);
      color: #fff; background: rgba(255,255,255,.08); cursor: pointer;
      font: 700 .72rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase;
    }
    #admin-toggle:hover { background: rgba(255,255,255,.16); }
    #admin-toggle.active { background: var(--gold); border-color: var(--gold); color: var(--navy); }

    main { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 70px; }

    .intro { margin: 0 0 30px; }
    .intro h1 { margin: 0; color: var(--navy); font: 700 clamp(1.7rem,4vw,2.2rem)/1.15 var(--font-heading); letter-spacing: -.015em; }
    /* Short gold rule under the headline, per the guide's divider-line pattern. */
    .intro h1::after { content: ''; display: block; margin: 14px 0 16px; width: 48px; height: 3px; background: var(--gold); }
    .intro p { margin: 0; max-width: 620px; color: var(--muted); line-height: 1.6; }

    .panel { border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); box-shadow: var(--shadow); }
    form.panel { padding: 24px; margin-bottom: 30px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { color: var(--muted); font: 700 .7rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase; }
    input, textarea {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--ink); font-family: var(--font-body); background: var(--white);
    }
    input:focus, textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(35,64,72,.14); }
    textarea { resize: vertical; min-height: 70px; }
    .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
    #submit-error { min-height: 1.1em; color: var(--red); font-size: .82rem; }
    button.primary {
      height: 42px; padding: 0 22px; border: 1px solid var(--teal); border-radius: var(--radius);
      color: #fff; background: var(--teal); cursor: pointer;
      font: 700 .78rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase;
      transition: background-color .18s ease, border-color .18s ease;
    }
    /* Hover steps to the brand black rather than a darker teal - the palette
       has no approved teal shade to step down to. */
    button.primary:hover:not(:disabled) { background: var(--navy); border-color: var(--navy); }
    button.primary:disabled { opacity: .6; cursor: default; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .filter-btn {
      height: 34px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--muted); background: var(--white); cursor: pointer;
      font: 700 .72rem var(--font-subheading); letter-spacing: .07em; text-transform: uppercase;
    }
    .filter-btn[aria-pressed="true"] { color: #fff; background: var(--navy); border-color: var(--navy); }
    .filter-btn:hover:not([aria-pressed="true"]) { border-color: var(--teal); color: var(--teal); }

    .list { display: grid; gap: 14px; }
    .idea-card { display: flex; gap: 16px; padding: 20px 22px; }
    .vote-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
    .vote-btn {
      width: 52px; height: 52px; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--navy); background: var(--white); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-family: var(--font-subheading); font-weight: 700;
      transition: border-color .18s ease, color .18s ease;
    }
    .vote-btn .arrow { font-size: .95rem; line-height: 1; }
    .vote-btn .count { font-size: .95rem; line-height: 1; font-variant-numeric: tabular-nums; }
    .vote-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
    /* Voted state reads through a gold border + gold numeral instead of a
       tinted fill, since the palette has no light gold to fill with. */
    .vote-btn.voted { border-color: var(--gold); color: var(--gold); }
    .vote-btn:disabled { cursor: default; }

    .idea-main { flex: 1; min-width: 0; }
    .idea-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 12px; }
    .idea-title { margin: 0; color: var(--navy); font: 600 1.15rem/1.3 var(--font-heading); }
    /* Outlined status chips: one approved accent per state, no invented tints. */
    .status-badge {
      display: inline-flex; align-items: center; padding: 3px 9px;
      border: 1px solid currentColor; border-radius: var(--radius);
      font: 700 .64rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase;
    }
    .status-new { color: var(--muted); }
    .status-planned { color: var(--gold); }
    .status-in-progress { color: var(--accent3); }
    .status-done { color: var(--teal); }
    .status-declined { color: var(--red); }
    .idea-desc { margin: 8px 0 0; color: var(--ink); line-height: 1.55; white-space: pre-wrap; }
    .idea-meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .8rem; }
    .idea-meta a { color: var(--teal); font-weight: 600; text-decoration: none; }
    .idea-meta a:hover { text-decoration: underline; }

    .admin-row { display: none; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    body.admin-mode .admin-row { display: flex; }
    .admin-row select { height: 34px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); }
    .admin-row .delete-btn {
      height: 34px; padding: 0 14px; border: 1px solid var(--red); border-radius: var(--radius);
      color: var(--red); background: var(--white); cursor: pointer;
      font: 700 .7rem var(--font-subheading); letter-spacing: .07em; text-transform: uppercase;
    }
    .admin-row .delete-btn:hover { color: #fff; background: var(--red); }

    .empty, .state { padding: 30px; border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); background: var(--white); text-align: center; }

    @media (max-width: 640px) {
      .field-row { grid-template-columns: 1fr; }
      .idea-card { flex-direction: column; }
      .vote-col { flex-direction: row; }
      .vote-btn { width: auto; height: auto; flex-direction: row; padding: 8px 14px; gap: 8px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="wordmark" href="../">
      <img class="wordmark-logo" src="../assets/brand-new/gs-logo-horizontal-white.png" alt="Gateway Seminary">
    </a>
    <div class="divider"></div>
    <div class="page-title">Slate Idea Box</div>
    <div class="spacer"></div>
    <button id="admin-toggle" type="button">Admin</button>
  </header>

  <main>
    <div class="intro">
      <h1>Got a Slate idea?</h1>
      <p>Suggest a query, portal, dashboard, or workflow improvement. Drop a link to the relevant Slate page if you have one. Upvote the ideas you'd like to see prioritized.</p>
    </div>

    <form id="submit-form" class="panel">
      <div class="field-row">
        <div class="field full">
          <label for="f-title">Idea title</label>
          <input id="f-title" name="title" maxlength="200" required placeholder="e.g. Add a saved-search shortcut to Record Lookup">
        </div>
        <div class="field full">
          <label for="f-description">Details</label>
          <textarea id="f-description" name="description" maxlength="2000" placeholder="What's the problem, and what would this look like?"></textarea>
        </div>
        <div class="field">
          <label for="f-url">Related Slate URL (optional)</label>
          <input id="f-url" name="url" type="url" maxlength="500" placeholder="https://enroll.gs.edu/manage/...">
        </div>
        <div class="field">
          <label for="f-submitter">Your name (optional)</label>
          <input id="f-submitter" name="submitter" maxlength="120" placeholder="Anonymous is fine">
        </div>
      </div>
      <div class="form-actions">
        <span id="submit-error"></span>
        <button class="primary" type="submit">Submit idea</button>
      </div>
    </form>

    <div class="filters" role="tablist" aria-label="Filter by status">
      <button class="filter-btn" type="button" data-status="all" aria-pressed="true">All</button>
      <button class="filter-btn" type="button" data-status="new" aria-pressed="false">New</button>
      <button class="filter-btn" type="button" data-status="planned" aria-pressed="false">Planned</button>
      <button class="filter-btn" type="button" data-status="in-progress" aria-pressed="false">In progress</button>
      <button class="filter-btn" type="button" data-status="done" aria-pressed="false">Done</button>
      <button class="filter-btn" type="button" data-status="declined" aria-pressed="false">Declined</button>
    </div>

    <div id="list" class="list">
      <div class="state">Loading ideas&hellip;</div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    const WORKER_URL = 'https://slate-idea-box.YOUR-SUBDOMAIN.workers.dev';

    const STATUS_LABELS = { 'new': 'New', 'planned': 'Planned', 'in-progress': 'In progress', 'done': 'Done', 'declined': 'Declined' };
    const VOTED_KEY = 'ideaBoxVotedIds';
    const ADMIN_KEY_STORAGE = 'ideaBoxAdminKey';

    const listEl = document.getElementById('list');
    const form = document.getElementById('submit-form');
    const submitError = document.getElementById('submit-error');
    const adminToggle = document.getElementById('admin-toggle');
    const filterBtns = Array.from(document.querySelectorAll('.filter-btn'));

    let ideas = [];
    let activeFilter = 'all';

    function getVotedIds() {
      try { return new Set(JSON.parse(localStorage.getItem(VOTED_KEY) || '[]')); }
      catch { return new Set(); }
    }
    function addVotedId(id) {
      const set = getVotedIds();
      set.add(id);
      try { localStorage.setItem(VOTED_KEY, JSON.stringify(Array.from(set))); } catch {}
    }
    function getAdminKey() {
      try { return sessionStorage.getItem(ADMIN_KEY_STORAGE) || ''; } catch { return ''; }
    }
    function setAdminKey(key) {
      try {
        if (key) sessionStorage.setItem(ADMIN_KEY_STORAGE, key);
        else sessionStorage.removeItem(ADMIN_KEY_STORAGE);
      } catch {}
    }
    function isAdminMode() { return Boolean(getAdminKey()); }

    function applyAdminUi() {
      document.body.classList.toggle('admin-mode', isAdminMode());
      adminToggle.classList.toggle('active', isAdminMode());
      adminToggle.textContent = isAdminMode() ? 'Exit admin' : 'Admin';
    }

    adminToggle.addEventListener('click', function () {
      if (isAdminMode()) {
        setAdminKey('');
        applyAdminUi();
        return;
      }
      const key = window.prompt('Enter the admin passphrase to manage idea statuses:');
      if (key) {
        setAdminKey(key.trim());
        applyAdminUi();
      }
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function formatDate(iso) {
      const d = new Date(iso.replace(' ', 'T') + 'Z');
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function render() {
      const votedIds = getVotedIds();
      const filtered = activeFilter === 'all' ? ideas : ideas.filter(function (i) { return i.status === activeFilter; });

      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">No ideas here yet.</div>';
        return;
      }

      listEl.innerHTML = filtered.map(function (idea) {
        const voted = votedIds.has(idea.id);
        const statusClass = 'status-' + idea.status;
        const desc = idea.description ? '<p class="idea-desc">' + escapeHtml(idea.description) + '</p>' : '';
        const link = idea.url ? '<a href="' + escapeHtml(idea.url) + '" target="_blank" rel="noopener">Open in Slate &rarr;</a>' : '';
        const submitter = idea.submitter ? escapeHtml(idea.submitter) : 'Anonymous';
        const statusOptions = Object.keys(STATUS_LABELS).map(function (key) {
          return '<option value="' + key + '"' + (key === idea.status ? ' selected' : '') + '>' + STATUS_LABELS[key] + '</option>';
        }).join('');

        return '' +
          '<div class="panel idea-card" data-id="' + idea.id + '">' +
            '<div class="vote-col">' +
              '<button class="vote-btn' + (voted ? ' voted' : '') + '" type="button" data-vote-id="' + idea.id + '"' + (voted ? ' disabled' : '') + '>' +
                '<span class="arrow">&#9650;</span><span class="count">' + idea.votes + '</span>' +
              '</button>' +
            '</div>' +
            '<div class="idea-main">' +
              '<div class="idea-head">' +
                '<h3 class="idea-title">' + escapeHtml(idea.title) + '</h3>' +
                '<span class="status-badge ' + statusClass + '">' + (STATUS_LABELS[idea.status] || idea.status) + '</span>' +
              '</div>' +
              desc +
              '<div class="idea-meta"><span>' + submitter + '</span><span>' + formatDate(idea.created_at) + '</span>' + (link ? '<span>' + link + '</span>' : '') + '</div>' +
              '<div class="admin-row">' +
                '<label for="status-' + idea.id + '" style="margin:0;">Status</label>' +
                '<select id="status-' + idea.id + '" data-status-id="' + idea.id + '">' + statusOptions + '</select>' +
                '<button class="delete-btn" type="button" data-delete-id="' + idea.id + '">Delete</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    async function loadIdeas() {
      try {
        const res = await fetch(WORKER_URL + '/api/ideas');
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        ideas = data.ideas || [];
        render();
      } catch (err) {
        listEl.innerHTML = '<div class="state">Couldn\'t load ideas right now. Try refreshing.</div>';
      }
    }

    filterBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeFilter = btn.dataset.status;
        filterBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
        render();
      });
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      submitError.textContent = '';
      const submitBtn = form.querySelector('button[type="submit"]');
      const payload = {
        title: form.title.value.trim(),
        description: form.description.value.trim(),
        url: form.url.value.trim(),
        submitter: form.submitter.value.trim(),
      };
      if (!payload.title) {
        submitError.textContent = 'Give the idea a title.';
        return;
      }
      submitBtn.disabled = true;
      try {
        const res = await fetch(WORKER_URL + '/api/ideas', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || 'Could not submit idea.');
        form.reset();
        await loadIdeas();
      } catch (err) {
        submitError.textContent = err.message || 'Could not submit idea.';
      } finally {
        submitBtn.disabled = false;
      }
    });

    listEl.addEventListener('click', async function (event) {
      const voteBtn = event.target.closest('[data-vote-id]');
      if (voteBtn) {
        const id = Number(voteBtn.dataset.voteId);
        voteBtn.disabled = true;
        try {
          const res = await fetch(WORKER_URL + '/api/ideas/' + id + '/vote', { method: 'POST' });
          if (!res.ok) throw new Error();
          addVotedId(id);
          await loadIdeas();
        } catch {
          voteBtn.disabled = false;
        }
        return;
      }

      const deleteBtn = event.target.closest('[data-delete-id]');
      if (deleteBtn) {
        const id = Number(deleteBtn.dataset.deleteId);
        if (!window.confirm('Delete this idea? This can\'t be undone.')) return;
        try {
          const res = await fetch(WORKER_URL + '/api/ideas/' + id, {
            method: 'DELETE',
            headers: { 'X-Admin-Key': getAdminKey() },
          });
          if (res.status === 401) {
            window.alert('Admin passphrase is wrong or expired. Re-enter it via the Admin button.');
            setAdminKey('');
            applyAdminUi();
            return;
          }
          if (!res.ok) throw new Error();
          await loadIdeas();
        } catch {
          window.alert('Could not delete that idea.');
        }
      }
    });

    listEl.addEventListener('change', async function (event) {
      const select = event.target.closest('[data-status-id]');
      if (!select) return;
      const id = Number(select.dataset.statusId);
      try {
        const res = await fetch(WORKER_URL + '/api/ideas/' + id, {
          method: 'PATCH',
          headers: { 'content-type': 'application/json', 'X-Admin-Key': getAdminKey() },
          body: JSON.stringify({ status: select.value }),
        });
        if (res.status === 401) {
          window.alert('Admin passphrase is wrong or expired. Re-enter it via the Admin button.');
          setAdminKey('');
          applyAdminUi();
          return;
        }
        if (!res.ok) throw new Error();
        await loadIdeas();
      } catch {
        window.alert('Could not update status.');
      }
    });

    applyAdminUi();
    loadIdeas();
  }());
  </script>
</body>
</html>
