<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Lookup</title>
  <style>
    :root { --ink:#12172b; --ink-soft:#5b6072; --line:#e1e3ea; --panel:#fff; --bg:#f5f6f8; --accent:#f5a623; --accent-dark:#c9860f; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
    * { box-sizing:border-box; } html, body { min-height:100%; } body { margin:0; min-height:100vh; background:var(--bg); padding:24px; } main { max-width:860px; min-height:calc(100vh - 48px); margin:auto; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 2px 10px #12172b12; }
    h1 { margin:0 0 6px; font-size:2rem; letter-spacing:-.02em; } p { color:var(--ink-soft); margin:0 0 20px; line-height:1.5; }
    label { display:block; margin:0; font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
    select, input { width:100%; height:42px; margin-top:6px; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font:inherit; background:#fff; }
    input:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px #12172b14; }
    .search { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) 112px; gap:12px; margin:20px 0; align-items:end; } button { height:42px; padding:0 18px; border:1px solid var(--accent-dark); border-radius:999px; background:var(--accent); color:var(--ink); font:inherit; font-weight:700; cursor:pointer; box-shadow:0 2px 0 var(--accent-dark); } button:active { transform:translateY(2px); box-shadow:none; }
    .profile { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:18px; }
    .field { padding:12px; border:1px solid var(--border); border-radius:4px; background:#fff; } .field b { display:block; margin-top:4px; font-size:1rem; }
    .empty { padding:28px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:10px; }
    @media (max-width:680px) { body { padding:14px; } main { min-height:calc(100vh - 28px); } .card { padding:20px; } .search { grid-template-columns:1fr; } button { width:100%; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Student Lookup</h1>
    <p id="summary">Search by first name, last name, or student ID.</p>
    <form id="searchForm" class="search">
      <label>First name<input id="first" name="first" type="text" autocomplete="given-name"></label>
      <label>Last name<input id="last" name="last" type="text" autocomplete="family-name"></label>
      <label>Student ID<input id="sisid" name="sisid" type="text"></label>
      <button type="submit">Search</button>
    </form>
    <div id="candidateArea" hidden>
      <label for="candidateSelect">Matching students</label>
      <select id="candidateSelect"><option value="">Choose a student…</option></select>
    </div>
    <section id="profile" class="profile" hidden></section>
    <div id="empty" class="empty">Enter a first name, last name, or student ID to begin.</div>
  </main>
  <script>
    const candidateArea = document.getElementById('candidateArea');
    const candidateSelect = document.getElementById('candidateSelect');
    const profile = document.getElementById('profile');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const searchForm = document.getElementById('searchForm');
    const allowedOrigin = 'https://enroll.gs.edu';

    function resize() { window.parent.postMessage({ type:'student-lookup-resize', height:Math.ceil(document.documentElement.scrollHeight) }, '*'); }
    function text(value) { return value == null || value === '' ? '—' : String(value); }
    function renderProfile(record) {
      profile.innerHTML = '';
      if (!record || !record.SIS_ID) return;
      const fields = [['Student ID','SIS_ID'],['First name','first'],['Last name','last'],['Email','email'],['Phone','phone'],['Program','program'],['Status','status'],['Record created','record_created_date'],['Term','term'],['Year','year'],['Church','church']];
      fields.forEach(([label,key]) => { const el=document.createElement('div'); el.className='field'; el.innerHTML=`<label>${label}</label><b></b>`; el.querySelector('b').textContent=text(record[key]); profile.appendChild(el); });
      profile.hidden=false; empty.hidden=true; summary.textContent='Student profile';
    }
    window.addEventListener('message', (event) => {
      if (event.origin !== allowedOrigin || !event.data || event.data.type !== 'student-lookup-data') return;
      const data = event.data.payload || {}; const candidates = Array.isArray(data.candidates) ? data.candidates : [];
      candidateSelect.innerHTML='<option value="">Choose a student…</option>';
      candidates.forEach(person => { const option=document.createElement('option'); option.value=person.SIS_ID || ''; option.textContent=`${text(person.first)} ${text(person.last)} — ${text(person.SIS_ID)}${person.email ? ' — '+person.email : ''}`; candidateSelect.appendChild(option); });
      candidateArea.hidden = candidates.length < 2;
      if (candidates.length === 1 && !data.profile) { window.parent.postMessage({ type:'student-lookup-select', studentId:candidates[0].SIS_ID }, '*'); }
      if (data.profile) renderProfile(data.profile); else if (candidates.length) { empty.hidden=false; empty.textContent='Select a student to view the full profile.'; summary.textContent=`${candidates.length} matching student${candidates.length === 1 ? '' : 's'}`; }
      else if (data.searched) { empty.hidden=false; empty.textContent='No students matched that search.'; summary.textContent='Student Lookup'; }
      requestAnimationFrame(resize);
    });
    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(searchForm).entries());
      if (!values.first && !values.last && !values.sisid) return;
      window.parent.postMessage({ type:'student-lookup-search', values }, '*');
    });
    candidateSelect.addEventListener('change', () => { if (candidateSelect.value) window.parent.postMessage({ type:'student-lookup-select', studentId:candidateSelect.value }, '*'); });
    window.addEventListener('load', () => { resize(); setTimeout(resize, 300); }); new ResizeObserver(resize).observe(document.documentElement);
  </script>
</body>
</html>
