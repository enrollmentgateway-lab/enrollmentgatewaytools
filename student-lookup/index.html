<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record Lookup</title>
  <style>
    :root { --ink:#12172b; --ink-soft:#5b6072; --line:#e1e3ea; --panel:#fff; --bg:#f5f6f8; --accent:#f5a623; --accent-dark:#c9860f; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
    * { box-sizing:border-box; } body { margin:0; min-height:552px; background:var(--bg); padding:24px; } main { max-width:860px; margin:auto; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 2px 10px #12172b12; }
    h1 { margin:0 0 6px; font-size:2rem; letter-spacing:-.02em; } p { color:var(--ink-soft); margin:0 0 20px; line-height:1.5; }
    label { display:block; margin:0; font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
    select, input { width:100%; height:42px; margin-top:6px; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; color:var(--ink); font:inherit; background:#fff; }
    input:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px #12172b14; }
    .search { display:grid; grid-template-columns:minmax(0,1fr) 112px; gap:12px; margin:20px 0; align-items:end; } .search-field { position:relative; } button { height:42px; padding:0 18px; border:1px solid var(--accent-dark); border-radius:999px; background:var(--accent); color:var(--ink); font:inherit; font-weight:700; cursor:pointer; box-shadow:0 2px 0 var(--accent-dark); } button:active { transform:translateY(2px); box-shadow:none; }
    .suggestions { position:absolute; z-index:10; top:calc(100% + 5px); right:0; left:0; max-height:310px; overflow-y:auto; border:1px solid var(--line); border-radius:9px; background:#fff; box-shadow:0 12px 28px #12172b24; }
    .suggestion { display:block; width:100%; height:auto; padding:12px 14px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:#fff; box-shadow:none; color:var(--ink); text-align:left; }
    .suggestion:last-child { border-bottom:0; } .suggestion:hover,.suggestion:focus-visible { background:#fffaf0; outline:none; } .suggestion:active { transform:none; }
    .suggestion-name { display:block; font-size:.95rem; } .suggestion-meta { display:block; margin-top:4px; color:var(--ink-soft); font-size:.78rem; font-weight:400; }
    .suggestions-message { padding:13px 14px; color:var(--ink-soft); font-size:.85rem; text-transform:none; letter-spacing:0; }
    .profile { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:18px; padding:24px; border:1px solid #d9dee7; border-radius:12px; background:linear-gradient(145deg,#eef1f5 0%,#f8f9fb 100%); box-shadow:inset 0 1px 0 #fff,0 8px 24px #12172b0d; }
    .profile-section-title { grid-column:1/-1; display:flex; align-items:center; gap:10px; margin-bottom:2px; color:#3f4658; font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .profile-section-title::before { content:""; width:22px; height:2px; background:var(--accent); }
    .field { min-width:0; padding:14px; border:1px solid #dfe3ea; border-radius:7px; background:#fff; box-shadow:0 2px 7px #12172b0a; } .field b { display:block; margin-top:5px; overflow-wrap:anywhere; font-size:1rem; }
    .field.feature { padding:18px; border-color:#edce8a; background:linear-gradient(145deg,#fff8e8,#fffdf7); box-shadow:0 3px 10px #c9860f17; } .field.feature b { font-size:1.15rem; color:var(--ink); }
    .empty { padding:28px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:10px; }
    .results { display:grid; gap:10px; margin-top:18px; } .result { width:100%; height:auto; padding:16px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); text-align:left; box-shadow:none; } .result:hover { border-color:var(--accent-dark); background:#fffaf0; } .result-name { display:block; font-size:1rem; } .result-meta { display:block; margin-top:5px; color:var(--ink-soft); font-size:.85rem; font-weight:400; }
    .profile-head { display:flex; align-items:start; justify-content:space-between; gap:16px; } .profile-head h1 { margin:0; } .profile-actions { display:flex; align-items:center; gap:16px; } .profile-action-link { color:var(--ink-soft); font-size:.85rem; text-decoration:none; white-space:nowrap; } .profile-action-link:hover { color:var(--ink); text-decoration:underline; }
    body.profile-mode main { max-width:1280px; } body.profile-mode .card { padding:36px 40px; } body.profile-mode .profile-head { padding-bottom:18px; border-bottom:1px solid var(--line); } body.profile-mode #summary { display:inline-flex; align-items:center; gap:8px; margin:14px 0 0; padding:7px 11px; border:1px solid #d6dce5; border-radius:999px; color:#465064; background:#edf0f4; font-size:.7rem; font-weight:800; letter-spacing:.1em; line-height:1; text-transform:uppercase; } body.profile-mode #summary::before { content:""; width:8px; height:8px; border-radius:50%; background:#778196; box-shadow:0 0 0 3px #fff; } body.profile-mode .profile { grid-template-columns:repeat(3,minmax(0,1fr)); } [hidden] { display:none !important; }
    .application-document { position:relative; max-width:960px; margin:38px auto 10px; padding:38px 42px 32px; border:1px solid #d8d1c1; border-radius:3px; background:linear-gradient(90deg,transparent 0,transparent 29px,#eadfc8 30px,#eadfc8 31px,transparent 32px),#fffdf8; box-shadow:0 18px 45px #12172b1a,0 2px 5px #12172b14; }
    .application-document::before { content:""; position:absolute; inset:8px; pointer-events:none; border:1px solid #ebe5d8; }
    .application-document-header,.application-document-footer { position:relative; display:flex; align-items:center; justify-content:space-between; gap:22px; }
    .application-document-meta { display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
    .international-badge { display:inline-flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid #2f6680; border-radius:999px; color:#234f65; background:#edf7fb; font-size:.66rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
    .international-symbol { font-size:1rem; line-height:1; }
    .application-document-eyebrow { display:block; margin-bottom:8px; color:#8d7452; font-size:.66rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    .application-document h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.5rem,3vw,2.1rem); font-weight:600; letter-spacing:-.015em; }
    .application-status { flex:0 0 auto; width:auto; height:auto; max-width:240px; padding:8px 13px; border:2px solid #a9762b; border-radius:0; color:#79501a; font-size:.7rem; font-weight:800; letter-spacing:.1em; text-align:center; text-transform:uppercase; transform:rotate(-1deg); background:transparent; box-shadow:none; cursor:default; }
    .application-status:disabled { opacity:1; color:#79501a; }
    .application-status.is-interactive { cursor:pointer; }
    .application-status.is-interactive::after { content:"View checklist"; display:block; margin-top:5px; font-size:.55rem; letter-spacing:.08em; }
    .application-status.is-interactive:hover { background:#fff4d8; }
    .application-status.is-interactive:focus-visible { outline:3px solid #e3b456; outline-offset:3px; }
    .application-status:active { transform:rotate(-1deg); box-shadow:none; }
    .materials-toggle { position:relative; display:block; width:auto; height:auto; margin:22px 0 0; padding:9px 16px; border-radius:4px; background:#f5a623; }
    .application-document-rule { position:relative; height:4px; margin:25px 0 9px; border-top:1px solid #b9ad98; border-bottom:1px solid #ded6c8; }
    .materials-checklist { position:relative; margin:24px 0 4px; padding:20px 22px; border:1px solid #d8d1c1; background:#fffaf0; }
    .materials-checklist h3 { margin:0 0 14px; font-family:Georgia,"Times New Roman",serif; font-size:1.15rem; font-weight:600; }
    .materials-list { display:grid; gap:9px; margin:0; padding:0; list-style:none; }
    .materials-item { display:flex; align-items:center; justify-content:space-between; gap:18px; padding-bottom:9px; border-bottom:1px solid #e5ddcf; }
    .materials-item:last-child { padding-bottom:0; border-bottom:0; }
    .materials-name { font-family:Georgia,"Times New Roman",serif; line-height:1.35; }
    .materials-state { flex:0 0 auto; font-size:.65rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    .materials-state.missing { color:#a24332; }
    .materials-state.received { color:#2a6b3c; }
    .materials-empty { margin:0; color:#877b68; font-family:Georgia,"Times New Roman",serif; }
    .application-fields { position:relative; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); margin:0; }
    .application-field { min-width:0; padding:19px 20px 18px 0; border-bottom:1px solid #ded8cc; }
    .application-field:nth-child(2n) { padding-right:0; padding-left:28px; border-left:1px solid #ded8cc; }
    .application-field dt { margin:0 0 7px; color:#877b68; font-size:.66rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .application-field dd { margin:0; overflow-wrap:anywhere; font-family:Georgia,"Times New Roman",serif; font-size:1.05rem; line-height:1.35; }
    .application-document-footer { margin-top:28px; color:#8a806f; font-family:Georgia,"Times New Roman",serif; font-size:.82rem; }
    @media (max-width:800px) { body { min-height:572px; padding:14px; } .card { padding:20px; } .search { grid-template-columns:1fr; } button { width:100%; } .materials-toggle { width:auto; } body.profile-mode .profile { grid-template-columns:repeat(2,minmax(0,1fr)); } .application-document { padding:30px 28px 26px 38px; } }
    @media (max-width:600px) { .profile-head { flex-direction:column; } .profile-actions { width:100%; justify-content:space-between; } .application-document-header,.application-document-footer { align-items:flex-start; flex-direction:column; } .application-document-meta { align-items:flex-start; } .application-fields { grid-template-columns:1fr; } .application-field,.application-field:nth-child(2n) { padding:17px 0; border-left:0; } }
    @media (max-width:520px) { body.profile-mode .profile { grid-template-columns:1fr; } }
    body.search-start { display:flex; min-height:100vh; align-items:center; } body.search-start main { width:100%; min-height:0; } body.search-start .card { min-height:0; padding:34px; }
  </style>
</head>
<body class="search-start">
  <main class="card">
    <div class="profile-head">
      <h1 id="title">Record Lookup</h1>
      <div class="profile-actions"><a id="searchAgain" class="profile-action-link" href="#" hidden>Search again</a></div>
    </div>
    <p id="summary">Search by first name, last name, or student ID.</p>
    <form id="searchForm" class="search">
      <label class="search-field">Name or student ID
        <input id="search" name="search" type="search" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" placeholder="First name, last name, or student ID">
        <div id="suggestions" class="suggestions" role="listbox" hidden></div>
      </label>
      <button type="submit">Search</button>
    </form>
    <section id="results" class="results" hidden></section>
    <section id="profile" class="profile" hidden></section>
    <section id="application" class="application-document" aria-labelledby="application-title" hidden>
      <div class="application-document-header">
        <div><span class="application-document-eyebrow">Application Record</span><h2 id="application-title">Application</h2></div>
        <div class="application-document-meta">
          <span id="international-badge" class="international-badge" hidden><span class="international-symbol" aria-hidden="true">&#127760;</span> International / F-1</span>
          <button id="application-status" class="application-status" type="button" disabled>Status not provided</button>
        </div>
      </div>
      <button id="materials-toggle" class="materials-toggle" type="button" aria-controls="materials-checklist" aria-expanded="false" hidden>View materials checklist</button>
      <section id="materials-checklist" class="materials-checklist" aria-labelledby="materials-checklist-title" hidden>
        <h3 id="materials-checklist-title">Materials Checklist</h3>
        <ul id="materials-list" class="materials-list"></ul>
        <p id="materials-empty" class="materials-empty" hidden>No checklist items were provided.</p>
      </section>
      <div class="application-document-rule"></div>
      <dl id="application-fields" class="application-fields"></dl>
      <div class="application-document-footer">
        <span>Gateway Seminary Admissions</span>
      </div>
    </section>
    <div id="empty" class="empty">Enter a first name, last name, or student ID to begin.</div>
  </main>
  <script>
    const results = document.getElementById('results');
    const title = document.getElementById('title');
    const searchAgain = document.getElementById('searchAgain');
    const app = document.querySelector('main');
    const profile = document.getElementById('profile');
    const application = document.getElementById('application');
    const applicationTitle = document.getElementById('application-title');
    const applicationStatus = document.getElementById('application-status');
    const internationalBadge = document.getElementById('international-badge');
    const materialsToggle = document.getElementById('materials-toggle');
    const materialsChecklist = document.getElementById('materials-checklist');
    const materialsList = document.getElementById('materials-list');
    const materialsEmpty = document.getElementById('materials-empty');
    const applicationFields = document.getElementById('application-fields');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('search');
    const suggestions = document.getElementById('suggestions');
    const allowedOrigin = 'https://enroll.gs.edu';
    let suggestionTimer = 0;
    let suggestionRequest = 0;

    function resize() { window.parent.postMessage({ type:'student-lookup-resize', height:Math.ceil(document.body.getBoundingClientRect().height) }, '*'); }
    function decodeEntities(value) {
      const named = { amp:'&', apos:"'", quot:'"', lt:'<', gt:'>', nbsp:'\u00a0', rsquo:'’', lsquo:'‘', rdquo:'”', ldquo:'“', ndash:'–', mdash:'—' };
      let decoded = String(value == null ? '' : value);
      for (let pass = 0; pass < 3; pass += 1) {
        const next = decoded.replace(/&#x([0-9a-f]+);/gi, (match, digits) => { const code = parseInt(digits, 16); return Number.isInteger(code) && code <= 0x10ffff ? String.fromCodePoint(code) : match; }).replace(/&#(\d+);/g, (match, digits) => { const code = parseInt(digits, 10); return Number.isInteger(code) && code <= 0x10ffff ? String.fromCodePoint(code) : match; }).replace(/&([a-z]+);/gi, (match, name) => Object.prototype.hasOwnProperty.call(named, name.toLowerCase()) ? named[name.toLowerCase()] : match);
        if (next === decoded) break;
        decoded = next;
      }
      return decoded;
    }
    function value(rawValue) { return decodeEntities(rawValue).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
    function text(rawValue) { const normalized = value(rawValue); return normalized === '' ? '—' : normalized; }
    function list(rawValue) {
      const seen = new Set();
      return decodeEntities(rawValue).replace(/<br\s*\/?\s*>/gi, '\n').replace(/<\/(?:li|p|div|tr)>/gi, '\n').replace(/<[^>]*>/g, ' ').split(/\r?\n|[,;|]+/).map(item => item.replace(/\s+/g, ' ').trim()).filter(item => { const key=item.toLowerCase(); if (!key || seen.has(key)) return false; seen.add(key); return true; });
    }
    function renderMaterialsChecklist(record) {
      const allItems = list(record.full_mats_list);
      const missingItems = list(record.missing_mats_list);
      const missingKeys = new Set(missingItems.map(item => item.toLowerCase()));
      missingItems.forEach(item => { if (!allItems.some(existing => existing.toLowerCase() === item.toLowerCase())) allItems.push(item); });
      materialsList.replaceChildren();
      allItems.forEach(item => { const row=document.createElement('li'); row.className='materials-item'; const name=document.createElement('span'); name.className='materials-name'; name.textContent=item; const state=document.createElement('span'); const isMissing=missingKeys.has(item.toLowerCase()); state.className='materials-state ' + (isMissing ? 'missing' : 'received'); state.textContent=isMissing ? 'Missing' : 'Received'; row.append(name,state); materialsList.appendChild(row); });
      materialsEmpty.hidden = allItems.length > 0;
      return allItems.length;
    }
    function showResultsLayout() { document.body.classList.remove('search-start'); }
    function hideSuggestions() { suggestions.hidden=true; suggestions.replaceChildren(); searchInput.setAttribute('aria-expanded','false'); }
    function renderSuggestions(candidates) {
      suggestions.replaceChildren();
      if (!candidates.length) { const message=document.createElement('div'); message.className='suggestions-message'; message.textContent='No suggested records found.'; suggestions.appendChild(message); }
      candidates.forEach(person => { const button=document.createElement('button'); button.className='suggestion'; button.type='button'; button.setAttribute('role','option'); button.innerHTML='<span class="suggestion-name"></span><span class="suggestion-meta"></span>'; button.querySelector('.suggestion-name').textContent=text(person.name); button.querySelector('.suggestion-meta').textContent=[person.SIS_ID,person.email,person.program].filter(Boolean).map(decodeEntities).join(' · '); button.addEventListener('click', () => { searchInput.value=value(person.name) || value(person.SIS_ID); hideSuggestions(); renderProfile(person); requestAnimationFrame(resize); }); suggestions.appendChild(button); });
      suggestions.hidden=false; searchInput.setAttribute('aria-expanded','true'); requestAnimationFrame(resize);
    }
    function renderApplication(record) {
      const fields = [['Degree / Program','app_degree'],['Application Round','app_round'],['Application Status','app_status'],['Application Created','app_created_date'],['Decision Code','decision_code'],['Term','app_term'],['Year','app_year']];
      const applicationKeys = ['app_degree','app_round','app_status','app_created_date','decision_code','app_term','app_year','app_f1','missing_mats_list','full_mats_list'];
      const hasApplication = applicationKeys.some(key => value(record[key])) || value(record.app_url);
      application.hidden = !hasApplication;
      if (!hasApplication) return;
      applicationTitle.textContent = value(record.app_degree) || 'Application';
      const applicationStatusValue = value(record.app_status);
      internationalBadge.hidden = value(record.app_f1).toLowerCase() !== 'yes';
      applicationStatus.textContent = applicationStatusValue || 'Status not provided';
      materialsChecklist.hidden = true;
      const materialsCount = renderMaterialsChecklist(record);
      const hasMaterialsChecklist = materialsCount > 0 || applicationStatusValue.toLowerCase().includes('awaiting material');
      materialsToggle.hidden = !hasMaterialsChecklist;
      materialsToggle.textContent = materialsCount > 0 ? `View materials checklist (${materialsCount})` : 'View materials checklist';
      materialsToggle.setAttribute('aria-expanded', 'false');
      applicationFields.replaceChildren();
      fields.forEach(([label,key]) => { const field=document.createElement('div'); field.className='application-field'; const term=document.createElement('dt'); const description=document.createElement('dd'); term.textContent=label; description.textContent=text(record[key]); field.append(term,description); applicationFields.appendChild(field); });
    }
    function renderProfile(record) {
      profile.innerHTML = '';
      if (!record) return;
      const profileHeading=document.createElement('div'); profileHeading.className='profile-section-title'; profileHeading.textContent='Person Profile'; profile.appendChild(profileHeading);
      const fields = [['Program','program'],['Status','status'],['Teaching Site','teachingsite'],['Pipeline','pipeline'],['Location Code','location_code'],['Email','email'],['Phone','phone'],['Birthdate','birthdate']];
      fields.forEach(([label,key]) => { const el=document.createElement('div'); el.className='field' + (['program','status','teachingsite'].includes(key) ? ' feature' : ''); el.innerHTML=`<label>${label}</label><b></b>`; el.querySelector('b').textContent=text(record[key]); profile.appendChild(el); });
      renderApplication(record);
      const status = value(record.status);
      showResultsLayout(); document.body.classList.add('profile-mode'); app.classList.add('profile-mode'); profile.hidden=false; empty.hidden=true; results.hidden=true; searchForm.hidden=true; searchAgain.hidden=false; title.textContent=value(record.name) || 'Record Profile'; summary.textContent=status || 'Status not provided';
      window.scrollTo(0, 0);
      window.parent.postMessage({ type:'student-lookup-scroll-top' }, '*');
    }
    function renderResults(candidates) {
      showResultsLayout(); document.body.classList.remove('profile-mode'); app.classList.remove('profile-mode'); results.innerHTML=''; results.hidden=false; empty.hidden=true; profile.hidden=true; application.hidden=true;
      candidates.forEach(person => { const button=document.createElement('button'); button.className='result'; button.type='button'; button.innerHTML='<span class="result-name"></span><span class="result-meta"></span>'; button.querySelector('.result-name').textContent=text(person.name); button.querySelector('.result-meta').textContent=[person.email, person.program, person.status, person.term, person.vear].filter(Boolean).map(decodeEntities).join(' · '); button.addEventListener('click', () => { renderProfile(person); requestAnimationFrame(resize); }); results.appendChild(button); });
      summary.textContent=`${candidates.length} matching records — select one to view the profile.`;
    }
    window.addEventListener('message', (event) => {
      if (event.origin !== allowedOrigin || !event.data) return;
      if (event.data.type === 'student-lookup-suggestions') {
        if (Number(event.data.requestId) !== suggestionRequest) return;
        renderSuggestions(Array.isArray(event.data.candidates) ? event.data.candidates : []);
        return;
      }
      if (event.data.type !== 'student-lookup-data') return;
      const data = event.data.payload || {}; const candidates = Array.isArray(data.candidates) ? data.candidates : [];
      searchInput.value = data.query && data.query.search || '';
      if (data.loadError) { showResultsLayout(); results.hidden=true; profile.hidden=true; application.hidden=true; empty.hidden=false; empty.textContent=data.loadError; summary.textContent='Record Lookup unavailable'; requestAnimationFrame(resize); return; }
      if (data.searched && Number(data.resultCount || candidates.length) > 100) { showResultsLayout(); results.hidden=true; profile.hidden=true; application.hidden=true; empty.hidden=false; empty.textContent='More than 100 records matched. Add another search value to narrow the results.'; summary.textContent='Refine your search'; requestAnimationFrame(resize); return; }
      if (data.profile || candidates.length === 1) renderProfile(data.profile || candidates[0]);
      else if (candidates.length > 1) renderResults(candidates);
      else if (candidates.length) { empty.hidden=false; empty.textContent='Loading the record profile…'; summary.textContent='Record Lookup'; }
      else if (data.searched) { showResultsLayout(); application.hidden=true; empty.hidden=false; empty.textContent='No records matched that search.'; summary.textContent='Record Lookup'; }
      requestAnimationFrame(resize);
    });
    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const search = searchInput.value.trim();
      if (!search) return;
      hideSuggestions();
      window.parent.postMessage({ type:'student-lookup-search', values:{ search } }, '*');
    });
    searchInput.addEventListener('input', () => {
      clearTimeout(suggestionTimer);
      const search=searchInput.value.trim();
      suggestionRequest += 1;
      if (search.length < 2) { hideSuggestions(); return; }
      const requestId=suggestionRequest;
      suggestions.innerHTML='<div class="suggestions-message">Finding records…</div>'; suggestions.hidden=false; searchInput.setAttribute('aria-expanded','true');
      suggestionTimer=setTimeout(() => { window.parent.postMessage({ type:'student-lookup-suggest', search, requestId }, '*'); }, 250);
    });
    searchInput.addEventListener('keydown', (event) => { if (event.key === 'Escape') hideSuggestions(); });
    document.addEventListener('click', (event) => { if (!searchForm.contains(event.target)) hideSuggestions(); });
    searchAgain.addEventListener('click', (event) => { event.preventDefault(); window.parent.postMessage({ type:'student-lookup-search', values:{} }, '*'); });
    materialsToggle.addEventListener('click', () => { const expanded=materialsToggle.getAttribute('aria-expanded') === 'true'; materialsToggle.setAttribute('aria-expanded', String(!expanded)); materialsToggle.textContent=expanded ? `View materials checklist${materialsList.children.length ? ` (${materialsList.children.length})` : ''}` : 'Hide materials checklist'; materialsChecklist.hidden=expanded; requestAnimationFrame(resize); });
    window.addEventListener('load', () => { resize(); setTimeout(resize, 300); }); new ResizeObserver(resize).observe(document.documentElement);
  </script>
</body>
</html>
